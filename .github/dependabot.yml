version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
      interval: daily
  commit-message:
      prefix: deps
  labels:
      - dependencies
  open-pull-requests-limit: 5

- package-ecosystem: nuget
  directories:
      - /AXPlayer.App/
      - /AXPlayer.Desktop/
      - /AXPlayer.Desktop.Windows/
  schedule:
      interval: daily
  commit-message:
      prefix: deps
  labels:
      - dependencies
  open-pull-requests-limit: 5
